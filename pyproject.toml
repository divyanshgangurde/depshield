[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depshield"
version = "0.1.0"
description = "Offline dependency vulnerability and typosquat checker for Python and Node projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rich>=13",
    "packaging>=23",
]

[project.scripts]
depshield = "depshield.cli:main"

[tool.setuptools.packages.find]
include = ["depshield*"]
